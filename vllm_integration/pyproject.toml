[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberfly-vllm-latent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Verified numeric brain and body inputs for original MiniCPM-o vLLM-Omni"

[project.entry-points."vllm_omni.general_plugins"]
cyberfly_latent = "vllm_integration.worker_plugin:register"

[project.entry-points."vllm.general_plugins"]
cyberfly_latent = "vllm_integration.worker_plugin:register"

[tool.setuptools]
packages = ["vllm_integration"]
package-dir = {vllm_integration = "."}
